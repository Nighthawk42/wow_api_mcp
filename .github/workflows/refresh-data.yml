name: Refresh API data

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ingest
      - run: npm test
      - name: Create pull request if data changed
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: data/
          branch: auto/refresh-data
          commit-message: "Refresh API data from wow-ui-source"
          title: "Refresh API data from wow-ui-source"
          body: |
            Automated weekly regeneration of `data/*.json` from the four
            wow-ui-source branches. See the per-flavor `meta` blocks for the
            new builds and commits.
